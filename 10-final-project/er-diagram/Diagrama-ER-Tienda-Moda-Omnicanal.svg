<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1660" viewBox="0 0 1600 1660">
<defs><style>
body{font-family:Arial,sans-serif}.title{font:700 34px Arial;fill:#fff}.subtitle{font:17px Arial;fill:#dce8f8}.entity{fill:#e8f5ed;stroke:#55a56c;stroke-width:2}.assoc{fill:#e8f1ff;stroke:#4785ce;stroke-width:2}.head{font:700 19px Arial;fill:#14532d}.ahead{font:700 18px Arial;fill:#1e40af}.field{font:15px Arial;fill:#1f2937}.key{font:700 13px Arial;fill:#64748b}.rel{font:15px Arial;fill:#334155}.section{font:700 21px Arial;fill:#17324f}
</style></defs>
<rect width="1600" height="1660" fill="#f1f5f9"/>
<rect x="28" y="24" width="1544" height="100" rx="18" fill="#12345b"/>
<text x="800" y="67" text-anchor="middle" class="title">ENTITY–RELATIONSHIP DIAGRAM</text>
<text x="800" y="96" text-anchor="middle" class="subtitle">Omnichannel Fashion Retail Database · Products, Inventory and Sales</text>
<!-- 3-column entity grid -->
<g transform="translate(40,155)">
<rect class="entity" width="480" height="190" rx="12"/><text x="240" y="31" text-anchor="middle" class="head">CATEGORIAS</text><path d="M0 43H480" stroke="#55a56c"/><text x="20" y="70" class="field">PK pk_categoria · INT · AUTO_INCREMENT</text><text x="20" y="98" class="field">nombre_categoria · VARCHAR(80) · UNIQUE</text><text x="20" y="126" class="field">descripcion · VARCHAR(255) · NULL</text>
</g>
<g transform="translate(560,155)">
<rect class="entity" width="480" height="190" rx="12"/><text x="240" y="31" text-anchor="middle" class="head">SUBCATEGORIAS</text><path d="M0 43H480" stroke="#55a56c"/><text x="20" y="70" class="field">PK pk_subcategoria · INT · AUTO_INCREMENT</text><text x="20" y="98" class="field">nombre_subcategoria · VARCHAR(80)</text><text x="20" y="126" class="field">descripcion · VARCHAR(255) · NULL</text><text x="20" y="154" class="field">FK fk_categoria → CATEGORIAS</text>
</g>
<g transform="translate(1080,155)">
<rect class="entity" width="480" height="190" rx="12"/><text x="240" y="31" text-anchor="middle" class="head">PRODUCTOS</text><path d="M0 43H480" stroke="#55a56c"/><text x="20" y="70" class="field">PK pk_producto · INT · AUTO_INCREMENT</text><text x="20" y="98" class="field">nombre_producto · descripcion</text><text x="20" y="126" class="field">precio_base · porcentaje_iva · estado_producto</text><text x="20" y="154" class="field">FK fk_subcategoria → SUBCATEGORIAS</text>
</g>
<g transform="translate(40,390)">
<rect class="entity" width="480" height="165" rx="12"/><text x="240" y="31" text-anchor="middle" class="head">ROPA</text><path d="M0 43H480" stroke="#55a56c"/><text x="20" y="75" class="field">PK/FK pk_producto → PRODUCTOS</text><text x="20" y="105" class="field">material · tipo_prenda</text>
</g>
<g transform="translate(560,390)">
<rect class="entity" width="480" height="165" rx="12"/><text x="240" y="31" text-anchor="middle" class="head">CALZADO</text><path d="M0 43H480" stroke="#55a56c"/><text x="20" y="75" class="field">PK/FK pk_producto → PRODUCTOS</text><text x="20" y="105" class="field">material · tipo_calzado</text>
</g>
<g transform="translate(1080,390)">
<rect class="entity" width="480" height="165" rx="12"/><text x="240" y="31" text-anchor="middle" class="head">COMPLEMENTOS</text><path d="M0 43H480" stroke="#55a56c"/><text x="20" y="75" class="field">PK/FK pk_producto → PRODUCTOS</text><text x="20" y="105" class="field">material · tipo_complemento</text>
</g>
<g transform="translate(40,600)">
<rect class="entity" width="480" height="190" rx="12"/><text x="240" y="31" text-anchor="middle" class="head">VARIANTES_PRODUCTO</text><path d="M0 43H480" stroke="#55a56c"/><text x="20" y="70" class="field">PK pk_variante · INT · AUTO_INCREMENT</text><text x="20" y="98" class="field">sku · UNIQUE · color · talla</text><text x="20" y="126" class="field">precio_variante · estado_variante</text><text x="20" y="154" class="field">FK fk_producto → PRODUCTOS</text>
</g>
<g transform="translate(560,600)">
<rect class="entity" width="480" height="165" rx="12"/><text x="240" y="31" text-anchor="middle" class="head">PUBLICOS_OBJETIVO</text><path d="M0 43H480" stroke="#55a56c"/><text x="20" y="75" class="field">PK pk_publico · INT · AUTO_INCREMENT</text><text x="20" y="105" class="field">nombre_publico · UNIQUE</text><text x="20" y="135" class="field">Hombre · Mujer · Unisex · Infantil</text>
</g>
<g transform="translate(1080,600)">
<rect class="assoc" width="480" height="165" rx="12"/><text x="240" y="31" text-anchor="middle" class="ahead">PRODUCTO_PUBLICO</text><path d="M0 43H480" stroke="#4785ce"/><text x="20" y="75" class="field">PK/FK fk_producto → PRODUCTOS</text><text x="20" y="105" class="field">PK/FK fk_publico → PUBLICOS_OBJETIVO</text><text x="20" y="135" class="field">Associative table · composite PK</text>
</g>
<g transform="translate(40,835)">
<rect class="entity" width="480" height="165" rx="12"/><text x="240" y="31" text-anchor="middle" class="head">SUCURSALES</text><path d="M0 43H480" stroke="#55a56c"/><text x="20" y="75" class="field">PK pk_sucursal · INT · AUTO_INCREMENT</text><text x="20" y="105" class="field">nombre_sucursal · direccion · ciudad</text><text x="20" y="135" class="field">telefono · NULL</text>
</g>
<g transform="translate(560,835)">
<rect class="entity" width="480" height="190" rx="12"/><text x="240" y="31" text-anchor="middle" class="head">INVENTARIO</text><path d="M0 43H480" stroke="#55a56c"/><text x="20" y="70" class="field">PK pk_inventario · INT · AUTO_INCREMENT</text><text x="20" y="98" class="field">FK fk_variante → VARIANTES_PRODUCTO</text><text x="20" y="126" class="field">FK fk_sucursal → SUCURSALES</text><text x="20" y="154" class="field">cantidad_disponible · stock_minimo</text>
</g>
<g transform="translate(1080,835)">
<rect class="entity" width="480" height="165" rx="12"/><text x="240" y="31" text-anchor="middle" class="head">CLIENTES</text><path d="M0 43H480" stroke="#55a56c"/><text x="20" y="75" class="field">PK pk_cliente · INT · AUTO_INCREMENT</text><text x="20" y="105" class="field">nombre · apellidos · correo_electronico</text><text x="20" y="135" class="field">telefono · fecha_registro</text>
</g>
<g transform="translate(40,1070)">
<rect class="entity" width="480" height="190" rx="12"/><text x="240" y="31" text-anchor="middle" class="head">VENTAS</text><path d="M0 43H480" stroke="#55a56c"/><text x="20" y="70" class="field">PK pk_venta · fecha_venta · canal_venta</text><text x="20" y="98" class="field">estado_venta</text><text x="20" y="126" class="field">FK fk_cliente → CLIENTES · NULL</text><text x="20" y="154" class="field">FK fk_sucursal → SUCURSALES</text>
</g>
<g transform="translate(560,1070)">
<rect class="assoc" width="480" height="190" rx="12"/><text x="240" y="31" text-anchor="middle" class="ahead">DETALLE_VENTA</text><path d="M0 43H480" stroke="#4785ce"/><text x="20" y="70" class="field">PK pk_detalle · cantidad</text><text x="20" y="98" class="field">precio_unitario · porcentaje_iva</text><text x="20" y="126" class="field">FK fk_venta → VENTAS</text><text x="20" y="154" class="field">FK fk_variante → VARIANTES_PRODUCTO</text>
</g>
<g transform="translate(1080,1070)">
<rect class="entity" width="480" height="190" rx="12"/><text x="240" y="31" text-anchor="middle" class="head">PAGOS</text><path d="M0 43H480" stroke="#55a56c"/><text x="20" y="70" class="field">PK pk_pago · metodo_pago · fecha_pago</text><text x="20" y="98" class="field">importe · estado_pago</text><text x="20" y="126" class="field">FK fk_venta → VENTAS · UNIQUE</text><text x="20" y="154" class="field">At most one payment per sale</text>
</g>
<rect x="40" y="1300" width="1520" height="320" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="70" y="1342" class="section">Relationships and cardinalities</text>
<text x="70" y="1382" class="rel">CATEGORIAS 1:N SUBCATEGORIAS · SUBCATEGORIAS 1:N PRODUCTOS · PRODUCTOS 1:N VARIANTES_PRODUCTO</text>
<text x="70" y="1418" class="rel">PRODUCTOS ISA ROPA / CALZADO / COMPLEMENTOS (Total and Disjoint specialization)</text>
<text x="70" y="1454" class="rel">PRODUCTOS N:M PUBLICOS_OBJETIVO via PRODUCTO_PUBLICO · VARIANTES_PRODUCTO N:M SUCURSALES via INVENTARIO</text>
<text x="70" y="1490" class="rel">CLIENTES 0..1:N VENTAS · SUCURSALES 1:N VENTAS · VENTAS 1:N DETALLE_VENTA</text>
<text x="70" y="1526" class="rel">VARIANTES_PRODUCTO 1:N DETALLE_VENTA · VENTAS 1:0..1 PAGOS</text>
<text x="70" y="1575" class="key">Green: main entity · Blue: associative entity · PK: primary key · FK: foreign key · UQ: unique · NULL: optional</text>
</svg>