<!-- notes -->
<rect x="48" y="1030" width="1065" height="190" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="72" y="1065" class="group">REGLAS DE INTEGRIDAD CLAVE</text>
<text x="72" y="1098" class="field">• PRODUCTO_PUBLICO: PK compuesta (fk_producto, fk_publico).</text>
<text x="72" y="1125" class="field">• INVENTARIO: UNIQUE (fk_variante, fk_sucursal).</text>
<text x="72" y="1152" class="field">• PAGOS: UNIQUE (fk_venta) — como máximo un pago por venta.</text>
<text x="72" y="1179" class="field">• Cada venta pertenece a una sucursal; los pedidos online se preparan desde esa sucursal.</text>
<rect x="1160" y="1030" width="580" height="190" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="1185" y="1065" class="group">LEYENDA</text>
<text x="1185" y="1098" class="field">PK = Primary Key · FK = Foreign Key · UQ = UNIQUE</text>
<text x="1185" y="1125" class="field">NULL = atributo opcional</text>
<text x="1185" y="1152" class="field">Verde = tabla principal · Azul = tabla asociativa</text>
<text x="1185" y="1179" class="field">ISA = especialización de PRODUCTOS</text>
<text x="900" y="1295" text-anchor="middle" class="muted">Esquema lógico aprobado para el proyecto académico · La implementación SQL se documentará en una fase posterior.</text>
</svg>