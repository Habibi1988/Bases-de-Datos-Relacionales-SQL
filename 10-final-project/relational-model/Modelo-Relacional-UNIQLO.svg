xt x="1203" y="261" class="field">nombre_sucursal</text><text x="1203" y="279" class="field">direccion · ciudad</text><text x="1203" y="297" class="field">telefono</text></g><g><rect x="1480" y="185" width="260" height="155" rx="10" class="assoc"/><path d="M1490 185h240q10 0 10 10v28h-260v-28q0-10 10-10" class="assochead"/><text x="1610" y="210" text-anchor="middle" class="th">INVENTARIO</text><text x="1493" y="243" class="field">PK pk_inventario</text><text x="1493" y="261" class="field">FK fk_variante</text><text x="1493" y="279" class="field">FK fk_sucursal</text><text x="1493" y="297" class="field">cantidad_disponible</text><text x="1493" y="315" class="field">stock_minimo · UQ variante+sucursal</text></g><g><rect x="1190" y="390" width="250" height="135" rx="10" class="card"/><path d="M1200 390h230q10 0 10 10v28h-250v-28q0-10 10-10" class="head"/><text x="1315" y="415" text-anchor="middle" class="th">CLIENTES</text><text x="1203" y="448" class="field">PK pk_cliente</text><text x="1203" y="466" class="field">nombre · apellidos</text><text x="1203" y="484" class="field">correo_electronico (UQ)</text><text x="1203" y="502" class="field">telefono · fecha_registro</text></g><g><rect x="1480" y="390" width="260" height="155" rx="10" class="card"/><path d="M1490 390h240q10 0 10 10v28h-260v-28q0-10 10-10" class="head"/><text x="1610" y="415" text-anchor="middle" class="th">VENTAS</text><text x="1493" y="448" class="field">PK pk_venta</text><text x="1493" y="466" class="field">fecha_venta · canal_venta</text><text x="1493" y="484" class="field">estado_venta</text><text x="1493" y="502" class="field">FK fk_cliente (NULL)</text><text x="1493" y="520" class="field">FK fk_sucursal</text></g><g><rect x="1190" y="820" width="250" height="155" rx="10" class="assoc"/><path d="M1200 820h230q10 0 10 10v28h-250v-28q0-10 10-10" class="assochead"/><text x="1315" y="845" text-anchor="middle" class="th">DETALLE_VENTA</text><text x="1203" y="878" class="field">PK pk_detalle</text><text x="1203" y="896" class="field">FK fk_venta · FK fk_variante</text><text x="1203" y="914" class="field">cantidad · precio_unitario</text><text x="1203" y="932" class="field">porcentaje_iva</text></g><g><rect x="1480" y="820" width="260" height="145" rx="10" class="card"/><path d="M1490 820h240q10 0 10 10v28h-260v-28q0-10 10-10" class="head"/><text x="1610" y="845" text-anchor="middle" class="th">PAGOS</text><text x="1493" y="878" class="field">PK pk_pago</text><text x="1493" y="896" class="field">FK fk_venta (UQ)</text><text x="1493" y="914" class="field">metodo_pago · fecha_pago</text><text x="1493" y="932" class="field">importe · estado_pago</text></g>
