<!-- caveats -->
<rect x="900" y="700" width="330" height="125" rx="8" fill="#fff8e8" stroke="#d0a04a"/>
<text class="n" x="918" y="728">PUNTOS POR VERIFICAR EN ACCESS</text>
<text class="n" x="918" y="752">* fecha_salida no aparece en la captura.</text>
<text class="n" x="918" y="775">* Confirmar PK de DEPARTAMENTOS.</text>
<text class="n" x="918" y="798">* CATEGORIA_CONDUCTORES existe;</text><text class="n" x="930" y="818">relación no visible en la captura.</text>
<text class="s" x="40" y="1120">PK = clave primaria · FK = clave foránea · TRAMOS_VIAJE: PK compuesta (fk_viaje, numero_tramo); al borrar un viaje, borrar sus tramos.</text>
